# NVIDIA GPU hosts only (Linux x86_64 with the NVIDIA Container Toolkit installed). Not tested yet.
#   docker compose -f docker-compose.yml -f docker/compose.gpu.yml up -d --build
services:
  mtah:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu124
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
